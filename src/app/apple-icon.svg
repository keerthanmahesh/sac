<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sac-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>

  <!-- iOS square background with gradient -->
  <rect width="512" height="512" rx="128" fill="url(#sac-bg)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="#6ee7b7" stroke-width="8" stroke-opacity="0.5" />

  <!-- Crossed Swords (Sac Brand Logo) -->
  <g transform="translate(96, 96) scale(13.333)" stroke="#09090b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/>
    <line x1="13" x2="19" y1="19" y2="13"/>
    <line x1="16" x2="20" y1="16" y2="20"/>
    <line x1="19" x2="21" y1="21" y2="19"/>
    <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/>
    <line x1="5" x2="9" y1="14" y2="18"/>
    <line x1="7" x2="4" y1="17" y2="20"/>
    <line x1="3" x2="5" y1="19" y2="21"/>
  </g>
</svg>
