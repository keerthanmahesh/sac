<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Deep British Racing Green Solid Base -->
  <rect width="512" height="512" fill="#012d1d" />

  <!-- Archival Hairline Inner Border -->
  <rect x="24" y="24" width="464" height="464" fill="none" stroke="#274e3d" stroke-width="6" />

  <!-- Crossed Swords (Sac Editorial Brand Emblem) -->
  <g transform="translate(106, 106) scale(12.5)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main Blade 1 (Top-Right to Bottom-Left) -->
    <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5" stroke="#fcf9f2" stroke-width="2.6" />
    <line x1="13" x2="19" y1="19" y2="13" stroke="#fcf9f2" stroke-width="2.6" />
    <line x1="16" x2="20" y1="16" y2="20" stroke="#994535" stroke-width="2.8" />
    <line x1="19" x2="21" y1="21" y2="19" stroke="#fcf9f2" stroke-width="2.6" />

    <!-- Main Blade 2 (Top-Left to Bottom-Right) -->
    <polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5" stroke="#fcf9f2" stroke-width="2.6" />
    <line x1="5" x2="9" y1="14" y2="18" stroke="#fcf9f2" stroke-width="2.6" />
    <line x1="7" x2="4" y1="17" y2="20" stroke="#994535" stroke-width="2.8" />
    <line x1="3" x2="5" y1="19" y2="21" stroke="#fcf9f2" stroke-width="2.6" />
  </g>
</svg>
